name: Container image
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['Dockerfile', 'container/**', 'scripts/**', 'tests/**', '.github/workflows/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test gateway and real browser form submission
        run: |
          export CHROMIUM_PATH="$(command -v google-chrome)"
          test -x "$CHROMIUM_PATH"
          node --test tests/*.test.mjs
      - run: pip install PyYAML
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests -p 'test_*.py'
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: t3-umbrel:test
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - run: bash scripts/smoke.sh t3-umbrel:test
      - name: Publish tested architecture
        if: github.event_name != 'pull_request'
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          docker tag t3-umbrel:test "$IMAGE:sha-${GITHUB_SHA}-${{ matrix.arch }}"
          docker push "$IMAGE:sha-${GITHUB_SHA}-${{ matrix.arch }}"
  manifest:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform manifest
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          TAG="sha-${GITHUB_SHA}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="${GITHUB_REF_NAME#v}"; fi
          docker buildx imagetools create --tag "$IMAGE:$TAG" \
            "$IMAGE:sha-${GITHUB_SHA}-amd64" "$IMAGE:sha-${GITHUB_SHA}-arm64"
          docker buildx imagetools inspect "$IMAGE:$TAG" >> "$GITHUB_STEP_SUMMARY"
