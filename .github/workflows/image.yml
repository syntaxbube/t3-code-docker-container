name: Container image
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'Dockerfile'
      - 'container/**'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'licenses/**'
      - 't3code-t3-code/**'
      - 'umbrel-app-store.yml'
      - 'scripts/smoke.sh'
      - 'scripts/validate.py'
      - 'scripts/update_t3.py'
      - 'tests/**'
      - '.github/workflows/image.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'container/**'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'licenses/**'
      - 't3code-t3-code/**'
      - 'umbrel-app-store.yml'
      - 'scripts/smoke.sh'
      - 'scripts/validate.py'
      - 'scripts/update_t3.py'
      - 'tests/**'
      - '.github/workflows/image.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
# Superseded pull request runs are cancelled; pushes and tags always finish publishing.
concurrency:
  group: image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test gateway and real browser form submission
        run: |
          export CHROMIUM_PATH="$(command -v google-chrome)"
          test -x "$CHROMIUM_PATH"
          node --test tests/*.test.mjs
      - run: python3 -c 'import yaml' 2>/dev/null || pip install --quiet PyYAML
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests -p 'test_*.py'
  # Image build and smoke tests run in parallel with the unit/browser tests; only the
  # multi-platform manifest (what consumers pull) is gated on the tests passing.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: t3-umbrel:test
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=max,scope={0}', matrix.arch) || '' }}
      - run: bash scripts/smoke.sh t3-umbrel:test
      - name: Publish tested architecture
        if: github.event_name != 'pull_request'
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          docker tag t3-umbrel:test "$IMAGE:sha-${GITHUB_SHA}-${{ matrix.arch }}"
          docker push "$IMAGE:sha-${GITHUB_SHA}-${{ matrix.arch }}"
  manifest:
    needs: [test, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform manifest
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          TAG="sha-${GITHUB_SHA}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="${GITHUB_REF_NAME#v}"; fi
          docker buildx imagetools create --tag "$IMAGE:$TAG" \
            "$IMAGE:sha-${GITHUB_SHA}-amd64" "$IMAGE:sha-${GITHUB_SHA}-arm64"
          docker buildx imagetools inspect "$IMAGE:$TAG" >> "$GITHUB_STEP_SUMMARY"
