manifestVersion: 1
id: t3code-t3-code
storage:
  dataRoot: data
category: Development
name: T3 Code
version: "0.1.8-umbrel.1"
tagline: Run Codex and Claude on your Umbrel
icon: https://raw.githubusercontent.com/syntaxbube/t3-code-docker-container/main/assets/icon.svg
description: >-
  Run T3 Code with Codex and Claude Code on your Umbrel and control your coding
  agents from a browser. Your own provider account or subscription is required.


  Open the app and enter the app password shown by Umbrel to pair your browser.
  Then enable a provider in Settings → Providers and sign in. Codex supports
  connecting your ChatGPT account from Settings. For Claude, use its provider
  sign-in flow or run claude auth login in the integrated terminal.


  For remote access, open Set up T3 Connect remote access on the setup page,
  sign in with username umbrel and your app password, then select Link / sign in.
  Approve the displayed device code to connect this server to your T3 account.


  Store projects under /home/node/projects. Projects, conversation history,
  provider credentials, and settings persist across restarts and upgrades.
  This community package is independently maintained and is not an official
  T3 Tools or Umbrel release.
releaseNotes: >-
  Updated T3 Code to stable release 0.1.8. Both Linux architectures passed
  container smoke tests before publication. Codex and Claude versions are unchanged.
developer: T3 Tools Inc
website: https://t3.codes
