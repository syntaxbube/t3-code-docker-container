repo: https://github.com/syntaxbube/t3-code-docker-container
support: https://github.com/syntaxbube/t3-code-docker-container/issues
port: 3774
gallery: []
path: /umbrel
defaultUsername: ""
defaultPassword: $APP_PASSWORD
deterministicPassword: true
submitter: syntaxbube
submission: https://github.com/syntaxbube/t3-code-docker-container
