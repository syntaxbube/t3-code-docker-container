version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: t3code-t3-code_server_1
      APP_PORT: 8080
  server:
    image: ghcr.io/syntaxbube/t3-code-docker-container:0.1.7-umbrel.5@sha256:954c066b1a17ff00dd9aa4cbf965dda59e812969249e2b884592416c67ac491a
    restart: on-failure
    user: "1000:1000"
    init: true
    stop_grace_period: 30s
    environment:
      APP_PASSWORD: ${APP_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/home:/home/node
