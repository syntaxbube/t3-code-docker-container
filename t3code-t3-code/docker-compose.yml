version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: t3code-t3-code_server_1
      APP_PORT: 8080
  server:
    image: ghcr.io/syntaxbube/t3-code-docker-container:0.1.9-umbrel.1@sha256:c98e5e4b911e458693e5109e3613d9e598098b13f09dc9d9dd7bb90258e6f5d7
    restart: on-failure
    user: "1000:1000"
    init: true
    stop_grace_period: 30s
    environment:
      APP_PASSWORD: ${APP_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/home:/home/node
