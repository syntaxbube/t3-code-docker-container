version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: t3code-t3-code_server_1
      APP_PORT: 8080
  server:
    image: ghcr.io/syntaxbube/t3-code-docker-container:0.1.10-umbrel.1@sha256:83b9a57f0daf708f293a1006a57eca6d3ca781bde4acfa7d0afbed1687cb296b
    restart: on-failure
    user: "1000:1000"
    init: true
    stop_grace_period: 30s
    environment:
      APP_PASSWORD: ${APP_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/home:/home/node
