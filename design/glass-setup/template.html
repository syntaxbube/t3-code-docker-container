<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>T3 Code · Pair this browser</title>
<!-- Unslop methodology: Damir Sokolovsky (@heydamir), CC BY 4.0. -->
<style>
:root{--bg:#0e0f11;--field:#141518;--hover:#15161a;--line:rgb(255 255 255/.08);--line-strong:rgb(255 255 255/.24);--t1:#ededef;--t2:#9b9ca3;--t3:#64656c;--ok:#5fb87a;
--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;--ease:cubic-bezier(.2,0,0,1)}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--t1);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{min-height:100svh;display:grid;grid-template-rows:auto 1fr auto}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--line-strong);outline-offset:2px}
.top,.foot{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:24px 32px;font-size:13px;color:var(--t2)}
.brand{display:flex;gap:10px;align-items:center;color:var(--t1);font-weight:500}
.mark{width:24px;height:24px;border-radius:6px;background:var(--t1);color:var(--bg);display:grid;place-items:center;font-size:11px;font-weight:600}
.host{font-family:var(--mono);font-size:12px;display:flex;gap:8px;align-items:center;color:var(--t3)}
.dot{width:6px;height:6px;border-radius:3px;background:var(--ok)}
main{display:grid;place-items:center;padding:32px}
.col{width:100%;max-width:360px}
h1{font-size:28px;font-weight:500;letter-spacing:-.02em;line-height:1.2;margin-bottom:8px}
.sub{font-size:14px;color:var(--t2);line-height:1.5;margin-bottom:32px}
.field{display:flex;align-items:center;height:48px;border:1px solid var(--line);border-radius:10px;background:var(--field);padding:4px 4px 4px 16px;gap:8px;transition:border-color .15s var(--ease)}
.field:focus-within{border-color:var(--line-strong)}
.field input{flex:1;min-width:0;height:100%;border:0;background:none;color:var(--t1);font-family:var(--mono);font-size:14px;outline:none}
.field input::placeholder{color:var(--t3)}
.go{height:38px;padding:0 14px;border:0;border-radius:7px;background:var(--t1);color:var(--bg);font:inherit;font-size:14px;font-weight:500;display:flex;gap:8px;align-items:center;cursor:pointer;transition:background-color .15s var(--ease),transform .1s var(--ease)}
.go:hover{background:#fff}
.go:active{transform:scale(.98)}
kbd{font-family:var(--mono);font-size:11px;padding:1px 5px;border-radius:4px;background:rgb(0 0 0/.1)}
.connect{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:24px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;transition:background-color .15s var(--ease)}
.connect:hover{background:var(--hover)}
.connect b{display:block;font-size:14px;font-weight:500}
.connect small{display:block;font-size:12px;color:var(--t2);margin-top:2px;line-height:1.4}
.connect .arrow{color:var(--t2)}
.text-button{color:var(--t2);transition:color .15s var(--ease)}
.text-button:hover{color:var(--t1)}
@media (max-width:600px){
  .top,.foot{padding:20px}
  main{place-items:start center;padding:72px 20px 32px}
  h1{font-size:24px}
}
@media (hover:none){kbd{display:none}}
</style>
</head>
<body>
<header class="top">
  <span class="brand"><span class="mark" aria-hidden="true">T3</span>T3 Code</span>
  <span class="host"><span class="dot" aria-hidden="true"></span>Umbrel</span>
</header>
<main>
  <div class="col">
    <h1>Pair this browser</h1>
    <p class="sub">Enter the app password from T3 Code's page in Umbrel. Not your Umbrel login</p>
    <form method="post" action="/umbrel/pair">
      <label class="field">
        <input type="password" name="password" placeholder="App password" aria-label="App password" autocomplete="current-password" required autofocus>
        <button class="go" type="submit">Connect <kbd aria-hidden="true">↵</kbd></button>
      </label>
    </form>
    <a class="connect" href="/umbrel/connect">
      <span><b>Set up T3 Connect</b><small>Use T3 Code from your phone or another computer</small></span>
      <span class="arrow" aria-hidden="true">→</span>
    </a>
  </div>
</main>
<footer class="foot">
  <a class="text-button" href="/">Already paired? Open T3 Code</a>
</footer>
</body>
</html>
